name: .NET Build and Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test MijnGameKast.API.Tests/MijnGameKast.API.Tests.csproj --configuration Release --no-build --verbosity normal